local_backend: true

backend:
  name: github
  repo: jaimielee/socialventure-magazine
  branch: main
  base_url: https://socialventure-decap-oauth.b095226.workers.dev
  auth_endpoint: auth

media_folder: public/uploads
public_folder: /uploads

slug:
  encoding: unicode
  clean_accents: false
  sanitize_replacement: "-"

publish_mode: editorial_workflow

collections:
  - name: insights
    label: Insights
    label_singular: Insight
    folder: src/content/insights
    create: true
    extension: mdx
    format: frontmatter
    identifier_field: coreSentence
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "insights/{{slug}}"
    fields:
      - { name: coreSentence, label: "한 줄 문장", widget: text, hint: "클릭하면 복사되는 본문 문장입니다." }
      - label: Type
        name: category
        widget: select
        default: "짧은 인사이트"
        options: ["짧은 인사이트", "한줄 메모", "책 인용", "영상 인용", "인터뷰 인용", "짧은 생각"]
      - { name: source, label: "출처", widget: string, required: false }
      - { name: sourceUrl, label: "출처 링크", widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false, hint: "필요하면 #으로 보여줄 태그를 넣습니다." }
      - { name: title, widget: hidden, default: "" }
      - { name: description, widget: hidden, default: "" }
      - { name: status, widget: hidden, default: published }
      - { name: originalNote, widget: hidden, default: "" }
      - { name: publishPotential, widget: hidden, default: 3 }
      - { name: updatedAt, widget: hidden, default: "{{now}}" }

  - name: articles
    label: Blog
    label_singular: Blog Post
    folder: src/content/articles
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "articles/{{slug}}"
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: "부제/요약", widget: text, required: false }
      - label: Type
        name: category
        widget: select
        default: "긴 글"
        options: ["긴 글", "에세이", "정리된 생각", "블로그형 글"]
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: coreSentence, label: "핵심 문장", widget: text }
      - { name: source, label: "출처", widget: string, required: false }
      - { name: sourceUrl, label: "출처 링크", widget: string, required: false }
      - { name: relatedSources, label: "원본 소스/참고 링크", widget: list, required: false }
      - { name: body, label: "내용", widget: markdown, required: false }
      - { name: status, widget: hidden, default: published }
      - { name: heroStyle, widget: hidden, default: text }
      - { name: readingMinutes, widget: hidden, default: 5 }
      - { name: publishPotential, widget: hidden, default: 3 }
      - { name: updatedAt, widget: hidden, default: "{{now}}" }

  - name: collections
    label: "실전 팁"
    label_singular: "실전 팁"
    folder: src/content/collections
    create: true
    extension: mdx
    format: frontmatter
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "collections/{{slug}}"
    fields:
      - { name: title, label: "제목", widget: string }
      - { name: subtitle, label: "부제", widget: string, required: false }
      - { name: description, label: "요약", widget: text, required: false }
      - label: Category
        name: category
        widget: select
        default: "노하우"
        options: ["노하우", "디지털 전환", "콘텐츠 제작", "실행 가이드"]
      - { name: body, label: "내용", widget: markdown, required: false }
      - { name: tags, label: "# 카테고리", widget: list, required: false }
      - { name: status, widget: hidden, default: published }
      - { name: publishPotential, widget: hidden, default: 3 }
      - { name: updatedAt, widget: hidden, default: "{{now}}" }
